<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <title>Justspin HUD Receiver</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Outfit', 'Inter', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: black;
            overflow: hidden;
            pointer-events: none;
        }

        #yt-player {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            box-sizing: border-box;
            pointer-events: none;
            background: transparent; /* 100% transparent background to unlock full video visibility */
        }

        #top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
        }

        .metric {
            text-align: center;
            background: rgba(0, 0, 0, 0.35); /* Ultra-light translucent backup to preserve contrast */
            border-radius: 20px;
            padding: 15px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .metric-value {
            font-size: 72px;
            font-weight: 900;
            color: #40C4FF;
            text-shadow: 0 0 20px rgba(64, 196, 255, 0.4);
            line-height: 1;
            display: inline-block;
            transition: transform 0.1s ease;
        }

        .metric-label {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #B0BEC5;
            letter-spacing: 1.5px;
            margin-top: 6px;
        }

        #activity-container {
            align-self: center;
            text-align: center;
            min-width: 650px;
            padding: 20px;
            background: transparent; /* Completely borderless and transparent activity display */
            box-shadow: none;
            border: none;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        #activity-name {
            font-size: 80px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00E676, #69F0AE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0, 230, 118, 0.25);
        }

        #timer {
            font-size: 150px;
            font-weight: 900;
            font-family: monospace;
            color: #00E676;
            text-shadow: 0 0 35px rgba(0, 230, 118, 0.45);
            letter-spacing: -2px;
        }

        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(0, 0, 0, 0.35); /* Soft translucent backplane for legibility */
            border-radius: 20px;
            padding: 15px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        #status-msg {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #song-info {
            font-size: 20px;
            font-weight: 600;
            color: #00E676;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        /* Cadence Pulse Metronome Animation */
        @keyframes cadence-pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(64, 196, 255, 0.4);
            }
            50% {
                transform: scale(1.1);
                text-shadow: 0 0 40px rgba(64, 196, 255, 0.8), 0 0 60px rgba(64, 196, 255, 0.4);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(64, 196, 255, 0.4);
            }
        }

        #debug-panel {
            position: absolute;
            bottom: 120px;
            right: 50px;
            width: 500px;
            height: 300px;
            background: rgba(0, 0, 0, 0.85);
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 14px;
            border: 2px solid rgba(0, 255, 0, 0.5);
            z-index: 9999;
            opacity: 0.9;
            pointer-events: none;
            display: none; /* Visually hidden to keep HUD screen clean */
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="yt-player"></div>
    </div>
    <div id="hud-overlay">
        <div id="top-bar">
            <div class="metric">
                <div class="metric-value" id="target-rpm">--</div>
                <div class="metric-label">Target RPM</div>
            </div>
        </div>

        <div id="activity-container">
            <div id="activity-name">GET READY</div>
            <div id="timer">00:00</div>
        </div>

        <div id="bottom-bar">
            <div id="status-msg">Connected to Justspin (Receiver v5.0.0)</div>
            <div id="song-info">
                Playing: <span id="song-title">Waiting for workout...</span>
            </div>
        </div>
    </div>

    <div id="debug-panel">
        <div class="log-entry">HUD Engine Booted...</div>
    </div>

    <script>
        // Global diagnostics
        window.onerror = function(message, source, lineno, colno, error) {
            const panel = document.getElementById('debug-panel');
            if (panel) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.style.color = '#FF5252';
                entry.textContent = 'ERR: ' + message + ' at L' + lineno;
                panel.appendChild(entry);
                panel.scrollTop = panel.scrollHeight;
            }
            return false;
        };

        function showLog(msg) {
            const panel = document.getElementById('debug-panel');
            if (panel) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = new Date().toLocaleTimeString() + ': ' + msg;
                panel.appendChild(entry);
                panel.scrollTop = panel.scrollHeight;
            }
        }

        showLog("HUD Engine Initializing...");

        // Inject YouTube IFrame API dynamically
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let ytPlayer = null;
        let currentVideoId = '';
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            showLog("YouTube API loaded, instantiating player...");
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                host: 'https://www.youtube-nocookie.com',
                videoId: '',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'showinfo': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            showLog("YouTube Player is Ready and Online!");
            isPlayerReady = true;
            event.target.mute(); // Ensure total TV speaker silence
        }

        function onPlayerError(event) {
            showLog("YouTube Player Error: " + event.data);
        }

        try {
            if (typeof cast === 'undefined' || typeof cast.framework === 'undefined') {
                throw new Error("Google Cast SDK not loaded.");
            }

            const context = cast.framework.CastReceiverContext.getInstance();
            const NAMESPACE = 'urn:x-cast:com.justspin.hud';

            const options = new cast.framework.CastReceiverOptions();
            options.customNamespaces = {};
            options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;

            context.addCustomMessageListener(NAMESPACE, function(event) {
                console.log('Message received:', event.data);
                
                let data = event.data;
                if (typeof data === 'string') {
                    try {
                        data = JSON.parse(data);
                    } catch(e) {
                        showLog('JSON parse fail: ' + e.message);
                        return;
                    }
                }

                if (data.type === 'UPDATE_HUD') {
                    showLog('Sync: ' + data.timer + ' (' + data.activityName + ')');
                    if (data.songTitle) {
                        document.getElementById('song-title').textContent = data.songTitle;
                    }
                    
                    // Determine remaining seconds
                    let secondsLeft = 999;
                    if (data.timer && data.timer.includes(':')) {
                        const parts = data.timer.split(':');
                        const minutes = parseInt(parts[0], 10);
                        const seconds = parseInt(parts[1], 10);
                        if (!isNaN(minutes) && !isNaN(seconds)) {
                            secondsLeft = (minutes * 60) + seconds;
                        }
                    }

                    if (data.activityName) {
                        const actElem = document.getElementById('activity-name');
                        actElem.textContent = data.activityName;
                        
                        const timerElem = document.getElementById('timer');
                        
                        // Apply time-based color transitions matching companion app
                        if (secondsLeft <= 5) {
                            actElem.style.background = 'linear-gradient(45deg, #FF1744, #FF5252)';
                            timerElem.style.color = '#FF5252';
                            timerElem.style.textShadow = '0 0 35px rgba(255, 82, 82, 0.45)';
                        } else if (secondsLeft <= 10) {
                            actElem.style.background = 'linear-gradient(45deg, #FF9100, #FFD600)';
                            timerElem.style.color = '#FFD600';
                            timerElem.style.textShadow = '0 0 35px rgba(255, 214, 0, 0.45)';
                        } else {
                            actElem.style.background = 'linear-gradient(45deg, #00E676, #69F0AE)';
                            timerElem.style.color = '#00E676';
                            timerElem.style.textShadow = '0 0 35px rgba(0, 230, 118, 0.45)';
                        }
                        actElem.style.webkitBackgroundClip = 'text';
                    }
                    if (data.timer) {
                        document.getElementById('timer').textContent = data.timer;
                    }
                    
                    // Update Target RPM & Dynamic Cadence Pulse metronome!
                    if (data.targetRpm) {
                        const rpmElem = document.getElementById('target-rpm');
                        rpmElem.textContent = data.targetRpm;
                        
                        // Extract the first available numeric cadence value
                        const match = data.targetRpm.match(/\d+/);
                        const rpmVal = match ? parseInt(match[0], 10) : 0;
                        
                        if (rpmVal > 0) {
                            // Duration of 1 pulse (seconds) = 60 / RPM
                            const pulseDuration = 60 / rpmVal;
                            rpmElem.style.animation = `cadence-pulse ${pulseDuration}s infinite ease-in-out`;
                            showLog("Dynamic Cadence Metronome: " + rpmVal + " RPM (" + pulseDuration.toFixed(2) + "s pulse)");
                        } else {
                            rpmElem.style.animation = 'none';
                        }
                    }

                    // Video ID & Playback synchronization!
                    if (data.videoId && ytPlayer && isPlayerReady) {
                        if (currentVideoId !== data.videoId) {
                            currentVideoId = data.videoId;
                            showLog("Syncing video ID: " + data.videoId);
                            
                            if (data.isTimerRunning) {
                                showLog("Loading and Autoplay video");
                                ytPlayer.loadVideoById(data.videoId, 0);
                            } else {
                                showLog("Cueing video (paused state)");
                                ytPlayer.cueVideoById(data.videoId, 0);
                            }
                        } else {
                            if (data.isTimerRunning !== undefined) {
                                const state = ytPlayer.getPlayerState();
                                if (data.isTimerRunning) {
                                    if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
                                        showLog("Playing TV video");
                                        ytPlayer.playVideo();
                                    }
                                } else {
                                    if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
                                        showLog("Pausing TV video");
                                        ytPlayer.pauseVideo();
                                    }
                                }
                            }
                        }
                    }
                }
            });

            context.start(options);
            showLog("HUD Dashboard Online and Listening!");
        } catch (err) {
            showLog("Fatal HUD crash: " + err.message);
        }
    </script>
</body>
</html>
