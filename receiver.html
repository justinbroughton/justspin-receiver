<!DOCTYPE html>
<html>
<head>
    <title>Justspin HUD Receiver (Minimal)</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf/receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: 'Inter', 'Roboto', sans-serif;
            color: white;
        }
        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        #song-info {
            font-size: 24px;
            font-weight: 500;
        }
        #song-title {
            color: #00E676;
            font-weight: 700;
        }
        #activity-container {
            align-self: center;
            margin-top: 20vh;
            text-align: center;
            min-width: 400px;
        }
        #activity-name {
            font-size: 64px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        #timer {
            font-size: 120px;
            font-weight: 900;
            font-family: monospace;
            color: #FF5252;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .metric {
            text-align: center;
        }
        .metric-value {
            font-size: 48px;
            font-weight: 900;
            color: #40C4FF;
        }
        .metric-label {
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            color: #B0BEC5;
        }
        #debug-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 350px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            color: #00FF00;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 3;
            pointer-events: none;
        }
        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="hud-overlay">
        <div id="top-bar" class="glass-panel">
            <div id="song-info">
                Playing: <span id="song-title">Waiting for song...</span>
            </div>
            <div class="metric">
                <div class="metric-value" id="target-rpm">--</div>
                <div class="metric-label">Target RPM</div>
            </div>
        </div>
        <div id="activity-container" class="glass-panel">
            <div id="activity-name">GET READY</div>
            <div id="timer">00:00</div>
        </div>
        <div id="bottom-bar" class="glass-panel">
            <div class="metric">
                <div class="metric-value" id="current-rpm">--</div>
                <div class="metric-label">Your RPM</div>
            </div>
            <div id="status-msg">Connected to Justspin</div>
        </div>
    </div>
    <div id="debug-panel">
        <div class="log-entry">Debug Log Started...</div>
    </div>
    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const NAMESPACE = 'urn:x-cast:com.justspin.hud';
        function showLog(msg) {
            const panel = document.getElementById('debug-panel');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ': ' + msg;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }
        context.addCustomMessageListener(NAMESPACE, function(event) {
            console.log('Received message:', event.data);
            showLog('Msg rcvd');
            
            let data = event.data;
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                    showLog('JSON parsed');
                } catch(e) {
                    showLog('Parse fail: ' + e.message);
                }
            }
            if (data.type === 'UPDATE_HUD') {
                showLog('HUD Update: ' + (data.songTitle || ''));
                if (data.songTitle) document.getElementById('song-title').textContent = data.songTitle;
                if (data.activityName) document.getElementById('activity-name').textContent = data.activityName;
                if (data.timer) document.getElementById('timer').textContent = data.timer;
                if (data.targetRpm) document.getElementById('target-rpm').textContent = data.targetRpm;
            } else if (data.type === 'LOAD_VIDEO') {
                showLog('Load Video: ' + data.videoId);
            }
        });
        context.start();
    </script>
</body>
</html>
