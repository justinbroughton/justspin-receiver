<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <title>Justspin HUD Receiver</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Outfit', 'Inter', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-color: black;
            overflow: hidden;
            pointer-events: none;
        }

        #yt-player {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
            box-sizing: border-box;
            pointer-events: none;
            background: rgba(11, 9, 20, 0.25);
        }

        .glass-panel {
            background: rgba(18, 15, 32, 0.88);
            border-radius: 24px;
            padding: 25px 45px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        #song-info {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        #song-title {
            color: #00E676;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        #activity-container {
            align-self: center;
            text-align: center;
            min-width: 650px;
            padding: 50px 80px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.4);
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        #activity-name {
            font-size: 76px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #FF3D00, #FF9100);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 61, 0, 0.15);
        }

        #timer {
            font-size: 140px;
            font-weight: 900;
            font-family: monospace;
            color: #FFF;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            letter-spacing: -2px;
        }

        #bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 64px;
            font-weight: 900;
            color: #40C4FF;
            text-shadow: 0 0 20px rgba(64, 196, 255, 0.4);
            line-height: 1;
        }

        .metric-label {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            color: #B0BEC5;
            letter-spacing: 1.5px;
            margin-top: 8px;
        }

        #status-msg {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #debug-panel {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 500px;
            height: 300px;
            background: rgba(0, 0, 0, 0.85);
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 14px;
            border: 2px solid rgba(0, 255, 0, 0.5);
            z-index: 9999;
            opacity: 0.9;
            pointer-events: none;
            display: block;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="yt-player"></div>
    </div>
    <div id="hud-overlay">
        <div id="top-bar" class="glass-panel">
            <div id="song-info">
                Playing: <span id="song-title">Waiting for workout...</span>
            </div>
            <div class="metric">
                <div class="metric-value" id="target-rpm">--</div>
                <div class="metric-label">Target RPM</div>
            </div>
        </div>

        <div id="activity-container" class="glass-panel">
            <div id="activity-name">GET READY</div>
            <div id="timer">00:00</div>
        </div>

        <div id="bottom-bar" class="glass-panel">
            <div id="status-msg">Connected to Justspin (Receiver v4.5.0)</div>
        </div>
    </div>

    <div id="debug-panel">
        <div class="log-entry">HUD Engine Booted...</div>
    </div>

    <script>
        // Global diagnostics
        window.onerror = function(message, source, lineno, colno, error) {
            const panel = document.getElementById('debug-panel');
            if (panel) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.style.color = '#FF5252';
                entry.textContent = 'ERR: ' + message + ' at L' + lineno;
                panel.appendChild(entry);
                panel.scrollTop = panel.scrollHeight;
            }
            return false;
        };

        function showLog(msg) {
            const panel = document.getElementById('debug-panel');
            if (panel) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = new Date().toLocaleTimeString() + ': ' + msg;
                panel.appendChild(entry);
                panel.scrollTop = panel.scrollHeight;
            }
        }

        showLog("HUD Engine Initializing...");

        // Inject YouTube IFrame API dynamically
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let ytPlayer = null;
        let currentVideoId = '';
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            showLog("YouTube API loaded, instantiating player...");
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                host: 'https://www.youtube-nocookie.com', // Bypass targeted tracking & minimize ad pre-rolls
                videoId: '',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'showinfo': 0,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            showLog("YouTube Player is Ready and Online!");
            isPlayerReady = true;
            event.target.mute(); // Mute TV speaker completely so sound streams exclusively from the phone app
        }

        function onPlayerError(event) {
            showLog("YouTube Player Error: " + event.data);
        }

        try {
            if (typeof cast === 'undefined' || typeof cast.framework === 'undefined') {
                throw new Error("Google Cast SDK not loaded.");
            }

            const context = cast.framework.CastReceiverContext.getInstance();
            const NAMESPACE = 'urn:x-cast:com.justspin.hud';

            const options = new cast.framework.CastReceiverOptions();
            options.customNamespaces = {};
            options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;

            context.addCustomMessageListener(NAMESPACE, function(event) {
                console.log('Message received:', event.data);
                
                let data = event.data;
                if (typeof data === 'string') {
                    try {
                        data = JSON.parse(data);
                    } catch(e) {
                        showLog('JSON parse fail: ' + e.message);
                        return;
                    }
                }

                if (data.type === 'UPDATE_HUD') {
                    showLog('Sync: ' + data.timer + ' (' + data.activityName + ')');
                    if (data.songTitle) {
                        document.getElementById('song-title').textContent = data.songTitle;
                    }
                    if (data.activityName) {
                        const actElem = document.getElementById('activity-name');
                        actElem.textContent = data.activityName;
                        
                        const act = data.activityName.toUpperCase();
                        if (act.includes('SPRINT') || act.includes('JUMP')) {
                            actElem.style.background = 'linear-gradient(45deg, #FF1744, #FF5252)';
                            document.getElementById('timer').style.color = '#FF5252';
                        } else if (act.includes('CLIMB')) {
                            actElem.style.background = 'linear-gradient(45deg, #FF9100, #FFD600)';
                            document.getElementById('timer').style.color = '#FFD600';
                        } else {
                            actElem.style.background = 'linear-gradient(45deg, #00E676, #69F0AE)';
                            document.getElementById('timer').style.color = '#FFF';
                        }
                        actElem.style.webkitBackgroundClip = 'text';
                    }
                    if (data.timer) {
                        document.getElementById('timer').textContent = data.timer;
                    }
                    if (data.targetRpm) {
                        document.getElementById('target-rpm').textContent = data.targetRpm;
                    }

                    // Video ID & Playback synchronization!
                    if (data.videoId && ytPlayer && isPlayerReady) {
                        if (currentVideoId !== data.videoId) {
                            currentVideoId = data.videoId;
                            showLog("Syncing video ID: " + data.videoId);
                            ytPlayer.loadVideoById(data.videoId, 0);
                        }

                        if (data.isTimerRunning !== undefined) {
                            const state = ytPlayer.getPlayerState();
                            if (data.isTimerRunning) {
                                if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
                                    showLog("Playing TV video");
                                    ytPlayer.playVideo();
                                }
                            } else {
                                if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
                                    showLog("Pausing TV video");
                                    ytPlayer.pauseVideo();
                                }
                            }
                        }
                    }
                }
            });

            context.start(options);
            showLog("HUD Dashboard Online and Listening!");
        } catch (err) {
            showLog("Fatal HUD crash: " + err.message);
        }
    </script>
</body>
</html>
